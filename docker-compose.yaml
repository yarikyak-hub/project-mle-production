version: '3.8'

services:
  # 1. Наш FastAPI микросервис
  ml_service:
    build:
      context: .
      dockerfile: Dockerfile_ml_service
    container_name: ml_service
    ports:
      - "8000:8000"
    env_file:
      - services/.env
    networks:
      - monitoring

  # 2. Prometheus (сборщик метрик)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # 3. Grafana (визуализация)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-1admin}
    depends_on:
      - prometheus
    networks:
      - monitoring
    volumes:
      - grafana_data:/var/lib/grafana

# Создаем общую сеть, чтобы контейнеры видели друг друга по именам
networks:
  monitoring:
    driver: bridge

volumes:
  grafana_data: